<!-- Add this Grocery Tab HTML section inside your app container -->
<div id="groceryView" style="max-width: 500px; margin: 0 auto;">
  <div style="display: flex; gap: 8px; margin-bottom: 12px;">
    <input type="text" id="newItemInput" placeholder="Add grocery item (e.g., Oat Milk)..." 
           style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 0.95rem;">
    <select id="itemCategory" style="padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
      <option value="Breakfast">🥛 Breakfast</option>
      <option value="Produce">🍌 Produce</option>
      <option value="Dinner Cook">🍳 Dinner Cook</option>
      <option value="Baby Snacks">👶 Baby Snacks</option>
    </select>
    <button onclick="addGroceryItem()" style="background: #2C5E3B; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold;">Add</button>
  </div>

  <!-- Quick Addition Chips -->
  <div style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px;">
    <button onclick="quickAdd('Full Cream Milk', 'Breakfast')" style="background: #E8F5E9; border: 1px solid #2E7D32; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; white-space: nowrap;">+ Milk</button>
    <button onclick="quickAdd('Eggs 12pk', 'Breakfast')" style="background: #E8F5E9; border: 1px solid #2E7D32; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; white-space: nowrap;">+ Eggs</button>
    <button onclick="quickAdd('Bananas', 'Produce')" style="background: #E8F5E9; border: 1px solid #2E7D32; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; white-space: nowrap;">+ Bananas</button>
    <button onclick="quickAdd('Baby Pouches', 'Baby Snacks')" style="background: #E8F5E9; border: 1px solid #2E7D32; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; white-space: nowrap;">+ Baby Snacks</button>
  </div>

  <!-- List Container -->
  <div id="groceryListContainer"></div>
</div>

<script>
  let groceryItems = JSON.parse(localStorage.getItem('adelaide_groceries')) || [
    { id: 1, name: "Full Cream Milk (Baby)", category: "Breakfast", bought: false },
    { id: 2, name: "Eggs (12-pack)", category: "Breakfast", bought: false },
    { id: 3, name: "Bananas & Apples", category: "Produce", bought: false },
    { id: 4, name: "Sourdough Bread", category: "Breakfast", bought: true }
  ];

  function saveGroceries() {
    localStorage.setItem('adelaide_groceries', JSON.stringify(groceryItems));
    renderGroceries();
  }

  function renderGroceries() {
    const container = document.getElementById('groceryListContainer');
    container.innerHTML = '';

    const categories = ["Breakfast", "Produce", "Dinner Cook", "Baby Snacks"];

    categories.forEach(cat => {
      const catItems = groceryItems.filter(item => item.category === cat);
      if (catItems.length === 0) return;

      const catHeader = document.createElement('h4');
      catHeader.style.cssText = "margin: 12px 0 6px 0; color: #2C5E3B; font-size: 0.9rem; text-transform: uppercase;";
      catHeader.innerText = cat;
      container.appendChild(catHeader);

      catItems.forEach(item => {
        const row = document.createElement('div');
        row.style.cssText = `display:flex; justify-content:space-between; align-items:center; background:#fff; padding:10px 12px; border-radius:8px; margin-bottom:6px; ${item.bought ? 'opacity:0.5;' : ''}`;
        row.innerHTML = `
          <label style="display:flex; align-items:center; gap:10px; flex:1; cursor:pointer;">
            <input type="checkbox" ${item.bought ? 'checked' : ''} onchange="toggleBought(${item.id})" style="width:18px; height:18px;">
            <span style="${item.bought ? 'text-decoration:line-through;' : 'font-weight:500;'}">${item.name}</span>
          </label>
          <button onclick="deleteGrocery(${item.id})" style="background:none; border:none; color:#d32f2f; cursor:pointer; font-size:1rem;">✕</button>
        `;
        container.appendChild(row);
      });
    });
  }

  function addGroceryItem() {
    const nameInput = document.getElementById('newItemInput');
    const catSelect = document.getElementById('itemCategory');
    if (!nameInput.value.trim()) return;

    groceryItems.push({
      id: Date.now(),
      name: nameInput.value.trim(),
      category: catSelect.value,
      bought: false
    });

    nameInput.value = '';
    saveGroceries();
  }

  function quickAdd(name, category) {
    groceryItems.push({ id: Date.now(), name, category, bought: false });
    saveGroceries();
  }

  function toggleBought(id) {
    const item = groceryItems.find(i => i.id === id);
    if (item) item.bought = !item.bought;
    saveGroceries();
  }

  function deleteGrocery(id) {
    groceryItems = groceryItems.filter(i => i.id !== id);
    saveGroceries();
  }

  renderGroceries();
</script>
